<div class="row">
  <div class="col-9 col-md-5 mx-auto">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.non_field_errors }}
        </div>

        <div class="mb-3">
            <label for="{{ form.gender.id_for_label }}" class="form-label">
                {{ form.gender.label }}
            </label>
            <select
                name="{{ form.gender.name }}"
                id="{{ form.gender.id_for_label }}"
                class="form-select{% if form.gender.errors %} is-invalid{% endif %}"
                required
            >
                {% for value, label in form.gender.field.choices %}
                    <option value="{{ value }}" {% if form.gender.value == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
            {% for error in form.gender.errors %}
                <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
        </div>

        <div class="mb-3">
            <label for="{{ form.age.id_for_label }}" class="form-label">
                {{ form.age.label }}
            </label>
            <input
                type="number"
                name="{{ form.age.name }}"
                id="{{ form.age.id_for_label }}"
                class="form-control{% if form.age.errors %} is-invalid{% endif %}"
                value="{{ form.age.value|default_if_none:'' }}"
                required
            >
            {% for error in form.age.errors %}
                <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
        </div>

        <div class="mb-3">
            <label for="{{ form.find_gender.id_for_label }}" class="form-label">
                {{ form.find_gender.label }}
            </label>
            <select
                name="{{ form.find_gender.name }}"
                id="{{ form.find_gender.id_for_label }}"
                class="form-select{% if form.find_gender.errors %} is-invalid{% endif %}"
                required
            >
                {% for value, label in form.find_gender.field.choices %}
                    <option value="{{ value }}" {% if form.find_gender.value == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
            {% for error in form.find_gender.errors %}
                <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
        </div>

        <div class="d-flex justify-content-center">
            <input type="submit" class="btn btn-primary rounded-pill" value="Сохранить">
        </div>
    </form>
  </div>
</div>
