{% extends "base.html" %}
{% load static %}

{% block title %}Компас{% endblock %}

{% block content %}

{% if user.is_authenticated %}

<div
    x-data="{
        index: 0,
        cards: {{ anketes }},

        async like() {
            if (!this.cards.length) return;

            await fetch('/like/' + this.cards[this.index].user_id, {
                method: 'POST'
            });

            this.index = (this.index + 1) % this.cards.length;
        },

        async dislike() {
            if (!this.cards.length) return;

            await fetch('/dislike/' + this.cards[this.index].user_id, {
                method: 'POST'
            });

            this.index = (this.index + 1) % this.cards.length;
        }
    }"
>
    <div x-show="cards.length" class="container mt-4">
        <div class="row">
            <div class="card col-10 col-md-6 offset-1 offset-md-3">

                <div
                    class="d-flex mx-auto justify-content-center w-50"
                    style="max-width: 30vh;"
                >
                    {% if user_icon %}
                        <img
                            src="{{ user_icon }}"
                            class="mt-3 border shadow rounded-circle"
                            style="width: 150px; height: 150px; object-fit: cover;"
                        >
                    {% else %}
                        <img
                            src="{% static 'default_user_icon.jpg' %}"
                            class="mt-3 border shadow rounded-circle"
                            style="width: 150px; height: 150px; object-fit: cover;"
                        >
                    {% endif %}
                </div>

                <div class="card-body">
                    <h5
                        x-text="cards[index].username"
                        class="card-title"
                    ></h5>

                    <p
                        x-text="cards[index].annotation"
                        class="card-text"
                    ></p>
                </div>

                <ul class="list-group list-group-flush">
                    <li
                        x-text="cards[index].age"
                        class="list-group-item"
                    ></li>
                </ul>

                <div class="card-body mx-auto">
                    <button
                        type="button"
                        class="btn btn-link card-link"
                        @click="like()"
                    >
                        <i class="fa-solid fa-heart text-danger"></i>
                    </button>

                    <button
                        type="button"
                        class="btn btn-link card-link"
                        @click="dislike()"
                    >
                        <i class="fa-solid fa-heart-crack text-black"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div
        x-show="!cards.length"
        class="container mt-4 text-center"
    >
        <p>Анкет пока нет</p>
    </div>
</div>

{% else %}
    Авторизуйтесь!
{% endif %}

{% endblock %}
