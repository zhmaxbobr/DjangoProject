{% extends "base.html" %}

{% block title %} Войти {% endblock %}

{% block content %}

<div class="row">
  <div class="col-9 col-md-5 mx-auto">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
        {{ form.non_field_errors }}
      </div>

      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label">
          {{ form.username.label }}
        </label>
        <input
          type="text"
          name="{{ form.username.name }}"
          id="{{ form.username.id_for_label }}"
          class="form-control{% if form.username.errors %} is-invalid{% endif %}"
          value="{{ form.username.value|default_if_none:'' }}"
          autocomplete="username"
          required
        >
        {% for error in form.username.errors %}
          <div class="invalid-feedback">{{ error }}</div>
        {% endfor %}
      </div>

      <div class="mb-3">
        <label for="{{ form.password.id_for_label }}" class="form-label">
          {{ form.password.label }}
        </label>
        <input
          type="password"
          name="{{ form.password.name }}"
          id="{{ form.password.id_for_label }}"
          class="form-control{% if form.password.errors %} is-invalid{% endif %}"
          autocomplete="current-password"
          required
        >
        {% for error in form.password.errors %}
          <div class="invalid-feedback">{{ error }}</div>
        {% endfor %}
      </div>
        <div class="d-flex justify-content-center">
          <input type="submit" class="btn btn-primary rounded-pill" value="Войти">
          <input type="hidden" name="next" value="{% url 'rl:profile' %}">
        </div>
    </form>
  </div>
</div>

<!--<a class="btn btn-warning" href="{% url 'password_reset' %}">Forgot the password?</a>-->

{% endblock %}
