<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>

<body style="background-color: #F0F4F8;">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #F0F4F8; border: 2px solid #D1D6DE;">
    <div class="container-fluid d-flex justify-content-between">
        <a class="navbar-brand" style="color: #1A1F2A" href="/">Компас</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse navbar-text" id="navbarSupportedContent">
            <ul class="navbar-nav d-flex justify-content-end">
                {% if not user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="/accounts/login" style="color: #1A1F2A">Войти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'rl:sign_up' %}" style="color: #1A1F2A">Зарегистрироваться</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
{% if messages %}
    <div class="row">
        {% for msg in messages %}
            <div role="alert" class="alert alert-{{msg.tags}} alert-dismissible fade show m-3 mx-auto col-9 col-md-5">
            {{msg}}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
             </div>
         {% endfor %}
</div>

{% endif %}
{% block content %}{% endblock %}

{# And js libs here #}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="//unpkg.com/alpinejs" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/js/fontawesome.min.js"></script>

</body>

</html>
